  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details with documented extension members.
      additionalProperties: true
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem type.
          example: 'https://api.titipin.example/problems/validation-failed'
        title:
          type: string
          description: Stable human-readable summary for this problem type.
          example: Request validation failed
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code repeated in the problem body.
          example: 422
        detail:
          type: string
          description: Event-specific explanation without stack traces, SQL, hostnames, tokens, or credentials.
          example: One or more request fields are invalid.
        instance:
          type: string
          format: uri-reference
          description: URI of the request or specific event that failed.
          example: /v1/requests
        invalidParameters:
          type: array
          description: Parameters that prevented the request from being parsed or processed.
          items:
            $ref: '#/components/schemas/InvalidParameter'
          example:
            - name: body
              location: body
              reason: malformed JSON
        headerName:
          type: string
          description: Header associated with the problem.
          example: Idempotency-Key
        requiredPermission:
          type: string
          description: Permission needed for the operation.
          example: request:create
        resourceType:
          type: string
          description: Type of resource involved in the problem.
          example: Request
        resourceId:
          type: string
          description: Opaque identifier of the resource involved in the problem.
          example: req_51Fa93cD
        currentStatus:
          type: string
          description: Current resource status when a transition is rejected.
          example: assigned
        allowedStatuses:
          type: array
          description: Resource statuses that allow the attempted operation.
          items:
            type: string
          example: [open]
        requestId:
          type: string
          description: Opaque request identifier associated with the problem.
          example: req_51Fa93cD
        selectedOfferId:
          type: string
          description: Offer already selected for the request.
          example: off_9Zx28LmQ
        assignmentId:
          type: string
          description: Assignment identifier associated with the problem.
          example: asg_3Bn71RtP
        paymentId:
          type: string
          description: Payment identifier associated with the problem.
          example: pay_4Lm82QwX
        paymentStatus:
          type: string
          description: Current payment status associated with the problem.
          example: declined
        reasonCode:
          type: string
          description: Safe reason code associated with a declined simulated payment.
          example: simulated_decline
        stockCheckedAt:
          type: string
          format: date-time
          description: Time at which stock was last checked.
          example: '2026-09-03T08:30:00+07:00'
        deliveryId:
          type: string
          description: Delivery identifier associated with the problem.
          example: dlv_8Qp21HsM
        confirmationId:
          type: string
          description: Receipt confirmation identifier associated with the problem.
          example: rcp_6Hs42QwX
        confirmedAt:
          type: string
          format: date-time
          description: Time at which receipt was confirmed.
          example: '2026-09-04T17:50:00+07:00'
        issueId:
          type: string
          description: Transaction issue identifier associated with the problem.
          example: iss_7Lm21QwX
        resolvedAt:
          type: string
          format: date-time
          description: Time at which an issue was resolved.
          example: '2026-09-03T09:20:00+07:00'
        originalRequestUri:
          type: string
          format: uri-reference
          description: URI bound to the first use of an idempotency key.
          example: /v1/requests/req_51Fa93cD
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Suggested retry delay in seconds.
          example: 2
        errors:
          type: array
          description: Field-level validation failures.
          items:
            $ref: '#/components/schemas/ValidationError'
          example:
            - field: quantity
              code: minimum
              message: quantity must be greater than or equal to 1

    InvalidParameter:
      type: object
      required: [name, location, reason]
      properties:
        name:
          type: string
          description: Name of the invalid parameter.
          example: body
        location:
          type: string
          enum: [path, query, header, body]
          description: Location of the invalid parameter.
          example: body
        reason:
          type: string
          description: Safe explanation of why the parameter is invalid.
          example: malformed JSON
      example:
        name: body
        location: body
        reason: malformed JSON

    ValidationError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: JSON field or query parameter that failed validation.
          example: quantity
        code:
          type: string
          description: Stable validation code.
          example: minimum
        message:
          type: string
          description: Human-readable validation message.
          example: quantity must be greater than or equal to 1
      example:
        field: quantity
        code: minimum
        message: quantity must be greater than or equal to 1

    Money:
      type: object
      description: Monetary value represented as an integer minor-unit amount and currency code.
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Amount in the minor unit of the stated currency. For IDR this is the integer rupiah amount.
          example: 150000
        currency:
          type: string
          enum: [IDR]
          description: ISO 4217 currency code for the amount.
          example: IDR
      example:
        amount: 150000
        currency: IDR

    PageInfo:
      type: object
      required: [limit, nextCursor, hasMore]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of items requested for the page.
          example: 10
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page, or null when there is no next page.
          example: eyJvZmZzZXQiOjEwfQ
        hasMore:
          type: boolean
          description: Whether another page is available.
          example: true
      example:
        limit: 10
        nextCursor: eyJvZmZzZXQiOjEwfQ
        hasMore: true

    RequestStatus:
      type: string
      enum: [open, assigned, completed, expired, cancelled, unavailable]
      description: Clients MUST treat an unrecognised value as non-terminal and MUST NOT crash or treat it as a terminal status.
      example: open

    OfferStatus:
      type: string
      enum: [active, selected, withdrawn, expired]
      description: Clients MUST treat an unrecognised value as non-terminal and MUST NOT crash.
      example: active

    AssignmentStatus:
      type: string
      enum: [active, purchased, completed, cancelled, unavailable]
      description: Clients MUST treat an unrecognised value as non-terminal and MUST NOT crash.
      example: active

    PaymentStatus:
      type: string
      enum: [pending, succeeded, declined, refunded]
      description: Clients MUST treat an unrecognised value as non-terminal and MUST NOT crash.
      example: succeeded

    DeliveryStatus:
      type: string
      enum: [pending, in_transit, delivered, confirmed]
      description: Clients MUST treat an unrecognised value as non-terminal and MUST NOT crash.
      example: in_transit

    IssueStatus:
      type: string
      enum: [open, in_review, resolved]
      description: Clients MUST treat an unrecognised value as non-terminal and MUST NOT crash.
      example: open

    AccountRole:
      type: string
      enum: [requester, jastiper, admin]
      description: Primary role used for authorization decisions in this contract.
      example: jastiper

    VerificationStatus:
      type: string
      enum: [unverified, pending, verified, suspended]
      description: Jastiper verification state when returned to an authorized actor.
      example: verified

    Request:
      type: object
      additionalProperties: true
      required: [requestId, requesterId, itemDescription, quantity, targetStoreOrArea, budget, deliveryAddress, deadline, status, selectedOfferId, assignedJastiperId, createdAt, updatedAt]
      properties:
        requestId:
          type: string
          description: Opaque server-generated request identifier.
          example: req_51Fa93cD
        requesterId:
          type: string
          description: Opaque account identifier of the requester.
          example: acc_req_7Kq91LmP
        itemDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Human-readable description of the requested item.
          example: Hard-cover research notebook
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: Number of items requested.
          example: 2
        targetStoreOrArea:
          type: string
          minLength: 1
          maxLength: 300
          description: Store or area where the jastiper should check availability.
          example: Gramedia Central Park
        budget:
          $ref: '#/components/schemas/Money'
          description: Maximum budget for the requested purchase.
          example:
            amount: 150000
            currency: IDR
        deliveryAddress:
          type: string
          minLength: 1
          maxLength: 500
          description: Address where the item should be delivered.
          example: Jl. Palmerah Barat No. 12, Jakarta
        deadline:
          type: string
          format: date-time
          description: RFC 3339 deadline with timezone offset for fulfilling the request.
          example: '2026-09-05T18:00:00+07:00'
        status:
          $ref: '#/components/schemas/RequestStatus'
          description: Current request lifecycle status.
          example: open
        selectedOfferId:
          type: [string, 'null']
          description: Selected offer identifier, or null while the request is open.
          example: null
        assignedJastiperId:
          type: [string, 'null']
          description: Assigned jastiper account identifier, or null while the request is open.
          example: null
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 creation timestamp with timezone offset.
          example: '2026-09-03T08:00:00+07:00'
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 last-update timestamp with timezone offset.
          example: '2026-09-03T08:00:00+07:00'
      example:
        requestId: req_51Fa93cD
        requesterId: acc_req_7Kq91LmP
        itemDescription: Hard-cover research notebook
        quantity: 2
        targetStoreOrArea: Gramedia Central Park
        budget:
          amount: 150000
          currency: IDR
        deliveryAddress: Jl. Palmerah Barat No. 12, Jakarta
        deadline: '2026-09-05T18:00:00+07:00'
        status: open
        selectedOfferId: null
        assignedJastiperId: null
        createdAt: '2026-09-03T08:00:00+07:00'
        updatedAt: '2026-09-03T08:00:00+07:00'

    CreateRequest:
      type: object
      additionalProperties: true
      required: [itemDescription, quantity, targetStoreOrArea, budget, deliveryAddress, deadline]
      properties:
        itemDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Human-readable description of the requested item.
          example: Hard-cover research notebook
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: Number of items requested.
          example: 2
        targetStoreOrArea:
          type: string
          minLength: 1
          maxLength: 300
          description: Store or area where the jastiper should check availability.
          example: Gramedia Central Park
        budget:
          $ref: '#/components/schemas/Money'
          description: Maximum budget for the requested purchase.
          example:
            amount: 150000
            currency: IDR
        deliveryAddress:
          type: string
          minLength: 1
          maxLength: 500
          description: Address where the item should be delivered.
          example: Jl. Palmerah Barat No. 12, Jakarta
        deadline:
          type: string
          format: date-time
          description: Future RFC 3339 deadline with timezone offset.
          example: '2026-09-05T18:00:00+07:00'
      example:
        itemDescription: Hard-cover research notebook
        quantity: 2
        targetStoreOrArea: Gramedia Central Park
        budget:
          amount: 150000
          currency: IDR
        deliveryAddress: Jl. Palmerah Barat No. 12, Jakarta
        deadline: '2026-09-05T18:00:00+07:00'

    Offer:
      type: object
      additionalProperties: true
      required: [offerId, requestId, jastiperId, status, itemPrice, serviceFee, deliveryFee, totalAmount, estimatedArrivalAt, stockCheckedAt, expiresAt, note, createdAt]
      properties:
        offerId:
          type: string
          description: Opaque server-generated offer identifier.
          example: off_9Zx28LmQ
        requestId:
          type: string
          description: Request to which the offer belongs.
          example: req_51Fa93cD
        jastiperId:
          type: string
          description: Account identifier of the verified jastiper who submitted the offer.
          example: acc_jas_2Rt71BnP
        status:
          $ref: '#/components/schemas/OfferStatus'
          description: Current offer lifecycle status.
          example: active
        itemPrice:
          $ref: '#/components/schemas/Money'
          description: Expected purchase price of the requested item.
          example:
            amount: 120000
            currency: IDR
        serviceFee:
          $ref: '#/components/schemas/Money'
          description: Simulated jastiper service fee.
          example:
            amount: 15000
            currency: IDR
        deliveryFee:
          $ref: '#/components/schemas/Money'
          description: Simulated delivery fee.
          example:
            amount: 10000
            currency: IDR
        totalAmount:
          $ref: '#/components/schemas/Money'
          description: Sum of item price, service fee, and delivery fee.
          example:
            amount: 145000
            currency: IDR
        estimatedArrivalAt:
          type: string
          format: date-time
          description: Estimated delivery arrival time with timezone offset.
          example: '2026-09-04T18:00:00+07:00'
        stockCheckedAt:
          type: string
          format: date-time
          description: Time at which the jastiper observed stock availability.
          example: '2026-09-03T08:10:00+07:00'
        expiresAt:
          type: string
          format: date-time
          description: Time after which the offer is no longer active.
          example: '2026-09-03T12:00:00+07:00'
        note:
          type: [string, 'null']
          maxLength: 500
          description: Optional human-readable note about the offer. No stock or purchase evidence is included.
          example: Item is available at the specified store.
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 offer creation timestamp with timezone offset.
          example: '2026-09-03T08:10:00+07:00'
      example:
        offerId: off_9Zx28LmQ
        requestId: req_51Fa93cD
        jastiperId: acc_jas_2Rt71BnP
        status: active
        itemPrice:
          amount: 120000
          currency: IDR
        serviceFee:
          amount: 15000
          currency: IDR
        deliveryFee:
          amount: 10000
          currency: IDR
        totalAmount:
          amount: 145000
          currency: IDR
        estimatedArrivalAt: '2026-09-04T18:00:00+07:00'
        stockCheckedAt: '2026-09-03T08:10:00+07:00'
        expiresAt: '2026-09-03T12:00:00+07:00'
        note: Item is available at the specified store.
        createdAt: '2026-09-03T08:10:00+07:00'

    CreateOffer:
      type: object
      additionalProperties: true
      required: [itemPrice, serviceFee, deliveryFee, estimatedArrivalAt, stockCheckedAt, expiresAt]
      properties:
        itemPrice:
          $ref: '#/components/schemas/Money'
          description: Expected purchase price of the requested item.
          example:
            amount: 120000
            currency: IDR
        serviceFee:
          $ref: '#/components/schemas/Money'
          description: Simulated jastiper service fee.
          example:
            amount: 15000
            currency: IDR
        deliveryFee:
          $ref: '#/components/schemas/Money'
          description: Simulated delivery fee.
          example:
            amount: 10000
            currency: IDR
        estimatedArrivalAt:
          type: string
          format: date-time
          description: Estimated delivery arrival time with timezone offset.
          example: '2026-09-04T18:00:00+07:00'
        stockCheckedAt:
          type: string
          format: date-time
          description: Time at which the jastiper observed stock availability.
          example: '2026-09-03T08:10:00+07:00'
        expiresAt:
          type: string
          format: date-time
          description: Time after which the offer is no longer active.
          example: '2026-09-03T12:00:00+07:00'
        note:
          type: [string, 'null']
          maxLength: 500
          description: Optional human-readable note about the offer.
          example: Item is available at the specified store.
      example:
        itemPrice:
          amount: 120000
          currency: IDR
        serviceFee:
          amount: 15000
          currency: IDR
        deliveryFee:
          amount: 10000
          currency: IDR
        estimatedArrivalAt: '2026-09-04T18:00:00+07:00'
        stockCheckedAt: '2026-09-03T08:10:00+07:00'
        expiresAt: '2026-09-03T12:00:00+07:00'
        note: Item is available at the specified store.

    SelectOfferRequest:
      type: object
      additionalProperties: true
      required: [offerId]
      properties:
        offerId:
          type: string
          description: Active offer selected by the requester.
          example: off_9Zx28LmQ
      example:
        offerId: off_9Zx28LmQ

    Assignment:
      type: object
      additionalProperties: true
      required: [assignmentId, requestId, offerId, assignedJastiperId, status, assignedAt, purchaseRecordedAt, completedAt, updatedAt]
      properties:
        assignmentId:
          type: string
          description: Opaque server-generated assignment identifier.
          example: asg_3Bn71RtP
        requestId:
          type: string
          description: Request associated with the assignment.
          example: req_51Fa93cD
        offerId:
          type: string
          description: Selected offer associated with the assignment.
          example: off_9Zx28LmQ
        assignedJastiperId:
          type: string
          description: Jastiper account assigned to the request.
          example: acc_jas_2Rt71BnP
        status:
          $ref: '#/components/schemas/AssignmentStatus'
          description: Current assignment lifecycle status.
          example: active
        assignedAt:
          type: string
          format: date-time
          description: RFC 3339 assignment creation timestamp with timezone offset.
          example: '2026-09-03T08:12:00+07:00'
        purchaseRecordedAt:
          type: [string, 'null']
