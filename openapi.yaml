components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived user access token. Browser and mobile clients must not use a shared client secret.
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: device-token
      description: Revocable per-device credential limited to delivery location updates.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Canonical hyphenated UUID version 4. Generate it when the user confirms the action and reuse it unchanged with the same method, URI, and body for every retry of that intent.
        The service retains the key and stored result for 24 hours from first receipt. Reuse with a different request returns 409 idempotency-key-reuse. An identical request still in progress returns 409 with Retry-After.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        example: 0f7c1b9e-3d21-4a6f-9c05-8e2b7d41a9f0
    RequestId:
      name: requestId
      in: path
      required: true
      description: Opaque server-generated request identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: req_51Fa93cD
    OfferId:
      name: offerId
      in: path
      required: true
      description: Opaque server-generated offer identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: off_9Zx28LmQ
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Opaque server-generated assignment identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: asg_3Bn71RtP
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: Opaque server-generated payment identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: pay_4Lm82QwX
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      description: Opaque server-generated delivery identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: dlv_8Qp21HsM
    ConfirmationId:
      name: confirmationId
      in: path
      required: true
      description: Opaque server-generated receipt confirmation identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: rcp_6Hs42QwX
    AccountId:
      name: accountId
      in: path
      required: true
      description: Opaque account identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: acc_jas_2Rt71BnP
    IssueId:
      name: issueId
      in: path
      required: true
      description: Opaque server-generated transaction issue identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: iss_7Lm21QwX
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. The service applies a default and an upper bound.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 10
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
        maxLength: 512
        example: eyJvZmZzZXQiOjEwfQ
    RequestStatusQuery:
      name: status
      in: query
      required: false
      description: Filters requests by one known status.
      schema:
        type: string
        enum: [open, assigned, completed, expired, cancelled, unavailable]
        example: open
    OfferStatusQuery:
      name: status
      in: query
      required: false
      description: Filters offers by one known status.
      schema:
        type: string
        enum: [active, selected, withdrawn, expired]
        example: active
    IssueStatusQuery:
      name: status
      in: query
      required: false
      description: Filters issues by one known status.
      schema:
        type: string
        enum: [open, in_review, resolved]
        example: open

  responses:
    InvalidRequest400:
      description: The request could not be parsed or its query, header, or structure is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidRequest:
              summary: Invalid request
              value:
                type: 'https://api.titipin.example/problems/invalid-request'
                title: Invalid request
                status: 400
                detail: The request body could not be parsed as valid JSON.
                instance: /v1/requests
                invalidParameters:
                  - name: body
                    location: body
                    reason: malformed JSON
    PostBadRequest400:
      description: The POST request is invalid or its required Idempotency-Key is missing or malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidRequest:
              summary: Invalid request
              value:
                type: 'https://api.titipin.example/problems/invalid-request'
                title: Invalid request
                status: 400
                detail: The request body could not be parsed as valid JSON.
                instance: /v1/requests
                invalidParameters:
                  - name: body
                    location: body
                    reason: malformed JSON
            invalidIdempotencyKey:
              summary: Invalid idempotency key
              value:
                type: 'https://api.titipin.example/problems/invalid-idempotency-key'
                title: Invalid idempotency key
                status: 400
                detail: Idempotency-Key must be a canonical UUID version 4.
                instance: /v1/requests
                headerName: Idempotency-Key
    AuthenticationRequired401:
      description: Authentication is required or the supplied token is invalid, expired, or revoked.
      headers:
        WWW-Authenticate:
          description: Authentication challenge.
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://api.titipin.example/problems/authentication-required'
            title: Authentication required
            status: 401
            detail: A valid access token is required.
            instance: /v1/requests
    Forbidden403:
      description: The authenticated identity lacks the role or permission required for the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://api.titipin.example/problems/forbidden'
            title: Action is not permitted
            status: 403
            detail: The authenticated account does not have permission to perform this action.
            instance: /v1/requests
            requiredPermission: request:create
    ResourceNotFound404:
      description: The requested resource does not exist or cannot be disclosed to this actor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://api.titipin.example/problems/resource-not-found'
            title: Resource not found
            status: 404
            detail: The requested resource was not found.
            instance: /v1/requests/req_51Fa93cD
            resourceType: Request
            resourceId: req_51Fa93cD
    ValidationFailed422:
      description: The JSON is valid, but one or more values violate a schema or domain constraint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://api.titipin.example/problems/validation-failed'
            title: Request validation failed
            status: 422
            detail: One or more request fields are invalid.
            instance: /v1/requests
            errors:
              - field: quantity
                code: minimum
                message: quantity must be greater than or equal to 1
    PaymentValidationOrDeclined422:
      description: The payment request is invalid or the valid simulated payment was declined.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationFailed:
              summary: Validation failed
              value:
                type: 'https://api.titipin.example/problems/validation-failed'
                title: Request validation failed
                status: 422
                detail: One or more payment fields are invalid.
                instance: /v1/assignments/asg_3Bn71RtP/payments
                errors:
                  - field: method
                    code: enum
                    message: method is not supported
            paymentDeclined:
              summary: Payment declined
              value:
                type: 'https://api.titipin.example/problems/payment-declined'
                title: Payment was declined
                status: 422
                detail: The simulated payment was declined by the configured test outcome.
                instance: /v1/assignments/asg_3Bn71RtP/payments
                assignmentId: asg_3Bn71RtP
                paymentId: pay_4Lm82QwX
                reasonCode: simulated_decline
    IdempotencyConflict409:
      description: The idempotency key was reused for a different request or the identical original request is still processing.
      headers:
        Retry-After:
          description: Present for idempotency-request-in-progress and omitted for other conflict types.
          schema:
            type: integer
            minimum: 1
            example: 2
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotencyKeyReuse:
              summary: Idempotency key reused for a different request
              value:
                type: 'https://api.titipin.example/problems/idempotency-key-reuse'
                title: Idempotency key reused for a different request
                status: 409
                detail: The supplied Idempotency-Key is already bound to another request.
                instance: /v1/requests
                originalRequestUri: /v1/requests/req_51Fa93cD
            idempotencyRequestInProgress:
              summary: Original request still in progress
              value:
                type: 'https://api.titipin.example/problems/idempotency-request-in-progress'
                title: The original request is still being processed
                status: 409
                detail: Retry the same request after the number of seconds stated in Retry-After.
                instance: /v1/assignments/asg_3Bn71RtP/payments
                retryAfterSeconds: 2
    InvalidStateOrIdempotency409:
      description: The operation is not allowed in the current state, or the idempotency key conflicts with an earlier request.
      headers:
        Retry-After:
          description: Present only for idempotency-request-in-progress.
          schema:
            type: integer
            minimum: 1
            example: 2
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidStateTransition:
              summary: Invalid state transition
              value:
                type: 'https://api.titipin.example/problems/invalid-state-transition'
                title: State transition is not allowed
                status: 409
                detail: The resource is not in a state that permits this operation.
                instance: /v1/requests/req_51Fa93cD/offers
                resourceType: Request
                resourceId: req_51Fa93cD
                currentStatus: assigned
                allowedStatuses: [open]
            idempotencyKeyReuse:
              summary: Idempotency key reused for a different request
              value:
                type: 'https://api.titipin.example/problems/idempotency-key-reuse'
                title: Idempotency key reused for a different request
                status: 409
                detail: The supplied Idempotency-Key is already bound to another request.
                instance: /v1/requests/req_51Fa93cD/offers
                originalRequestUri: /v1/requests/req_51Fa93cD/offers
            idempotencyRequestInProgress:
              summary: Original request still in progress
              value:
                type: 'https://api.titipin.example/problems/idempotency-request-in-progress'
                title: The original request is still being processed
                status: 409
                detail: Retry the same request after the number of seconds stated in Retry-After.
                instance: /v1/requests/req_51Fa93cD/offers
                retryAfterSeconds: 2
    AssignmentConflict409:
      description: The request cannot receive another assignment or its idempotency key conflicts with an earlier request.
      headers:
        Retry-After:
          description: Present only for idempotency-request-in-progress.
          schema:
            type: integer
            minimum: 1
            example: 2
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidStateTransition:
              summary: Invalid state transition
              value:
                type: 'https://api.titipin.example/problems/invalid-state-transition'
                title: State transition is not allowed
                status: 409
                detail: The request is not open and cannot receive an assignment.
                instance: /v1/requests/req_51Fa93cD/assignments
                resourceType: Request
                resourceId: req_51Fa93cD
                currentStatus: expired
                allowedStatuses: [open]
            offerAlreadySelected:
              summary: Offer already selected
              value:
                type: 'https://api.titipin.example/problems/offer-already-selected'
                title: An offer has already been selected
                status: 409
                detail: Request req_51Fa93cD already has a selected offer.
                instance: /v1/requests/req_51Fa93cD/assignments
                requestId: req_51Fa93cD
                selectedOfferId: off_9Zx28LmQ
                assignmentId: asg_3Bn71RtP
            idempotencyKeyReuse:
              summary: Idempotency key reused for a different request
              value:
                type: 'https://api.titipin.example/problems/idempotency-key-reuse'
                title: Idempotency key reused for a different request
                status: 409
                detail: The supplied Idempotency-Key is already bound to another request.
                instance: /v1/requests/req_51Fa93cD/assignments
                originalRequestUri: /v1/requests/req_51Fa93cD/assignments
            idempotencyRequestInProgress:
              summary: Original request still in progress
              value:
                type: 'https://api.titipin.example/problems/idempotency-request-in-progress'
                title: The original request is still being processed
                status: 409
                detail: Retry the same request after the number of seconds stated in Retry-After.
                instance: /v1/requests/req_51Fa93cD/assignments
                retryAfterSeconds: 2
    DeliveryConflict409:
      description: Delivery creation is rejected because payment, item availability, state, or idempotency conditions are not satisfied.
      headers:
        Retry-After:
          description: Present only for idempotency-request-in-progress.
          schema:
            type: integer
            minimum: 1
            example: 2
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidStateTransition:
              summary: Invalid state transition
              value:
                type: 'https://api.titipin.example/problems/invalid-state-transition'
                title: State transition is not allowed
                status: 409
                detail: The assignment is not in a state that permits delivery creation.
