        method: simulated_card

    Payment:
      type: object
      additionalProperties: true
      required: [paymentId, assignmentId, amount, method, status, failureReasonCode, commission, createdAt, updatedAt, refundedAt]
      properties:
        paymentId:
          type: string
          description: Opaque server-generated payment identifier.
          example: pay_4Lm82QwX
        assignmentId:
          type: string
          description: Assignment associated with the payment.
          example: asg_3Bn71RtP
        amount:
          $ref: '#/components/schemas/Money'
          description: Amount processed by the simulated payment.
          example:
            amount: 145000
            currency: IDR
        method:
          type: string
          enum: [simulated_card, simulated_bank_transfer]
          description: Simulated payment method.
          example: simulated_card
        status:
          $ref: '#/components/schemas/PaymentStatus'
          description: Current simulated payment status.
          example: succeeded
        failureReasonCode:
          type: [string, 'null']
          description: Safe reason code when payment is declined, or null otherwise.
          example: null
        commission:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Simulated commission derived from the transaction and returned only when the actor is authorized to view it. Commission is not a standalone resource.
          example: null
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 payment creation timestamp with timezone offset.
          example: '2026-09-03T08:35:00+07:00'
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 last-update timestamp with timezone offset.
          example: '2026-09-03T08:35:01+07:00'
        refundedAt:
          type: [string, 'null']
          description: RFC 3339 refund timestamp, or null when no refund occurred.
          example: null
      example:
        paymentId: pay_4Lm82QwX
        assignmentId: asg_3Bn71RtP
        amount:
          amount: 145000
          currency: IDR
        method: simulated_card
        status: succeeded
        failureReasonCode: null
        commission: null
        createdAt: '2026-09-03T08:35:00+07:00'
        updatedAt: '2026-09-03T08:35:01+07:00'
        refundedAt: null

