openapi: 3.1.0
info:
  title: Titipin API
  version: 0.1.0
  description: |
    Titipin adalah platform yang menyediakan layanan 
    titip barang dari luar negeri ke Indonesia.
    All monetary amounts are integers in the minor unit
    of the stated currency. Clients MUST ignore unknown
    response fields.

servers:
  - url: https://api.titipin.example/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development


tags:
  - name: Requests
    description: Item requests created by requesters.
  - name: Offers
    description: Offers submitted by verified shoppers.
  - name: Assignments
    description: The selected offer and active shopper assignment for a request.
  - name: Payments
    description: Simulated payments associated with assignments.
  - name: Deliveries
    description: Delivery tracking and receipt confirmation.
  - name: Accounts
    description: Limited account representations.
  - name: Issues
    description: Operational transaction issues handled by administrators.

security:
  - bearerAuth: []

paths:
  /requests:
    get:
      tags: [Requests]
      operationId: listRequests
      summary: List item requests
      description: |
        Returns a paginated collection of requests visible to the authenticated account.
        The optional status filter only narrows the same resource type. Results are never unbounded.
        An MCP operations client may read this collection but may not use it to perform a consequential action.
      x-required-roles: [requester, jastiper, admin]
      parameters:
        - $ref: '#/components/parameters/RequestStatusQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated request collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
              example:
                items: []
                page:
                  limit: 10
                  nextCursor: eyJvZmZzZXQiOjEwfQ
                  hasMore: true
        '400':
          $ref: '#/components/responses/InvalidRequest400'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
      tags: [Requests]
      operationId: createRequest
      summary: Create an item request
      description: |
        Creates one request for an item, target store or area, budget, delivery address, and deadline.
        The requester identity comes from the access token. This unsafe operation requires Idempotency-Key.
      x-required-roles: [requester]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
            example:
              itemDescription: Hard-cover research notebook
              quantity: 2
              targetStoreOrArea: Gramedia Central Park
              budget:
                amount: 150000
                currency: IDR
              deliveryAddress: Jl. Palmerah Barat No. 12, Jakarta
              deadline: '2026-09-05T18:00:00+07:00'
      responses:
        '201':
          description: Request created. Identical retries return the stored response and identifier.
          headers:
            Location:
              description: URI of the created request.
              schema:
                type: string
                example: /v1/requests/req_51Fa93cD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
              example:
                requestId: req_51Fa93cD
                requesterId: acc_req_7Kq91LmP
                itemDescription: Hard-cover research notebook
                quantity: 2
                targetStoreOrArea: Gramedia Central Park
                budget:
                  amount: 150000
                  currency: IDR
                deliveryAddress: Jl. Palmerah Barat No. 12, Jakarta
                deadline: '2026-09-05T18:00:00+07:00'
                status: open
                selectedOfferId: null
                assignedJastiperId: null
                createdAt: '2026-09-03T08:00:00+07:00'
                updatedAt: '2026-09-03T08:00:00+07:00'
        '400':
          $ref: '#/components/responses/PostBadRequest400'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          $ref: '#/components/responses/IdempotencyConflict409'
        '422':
          $ref: '#/components/responses/ValidationFailed422'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /requests/{requestId}:
    get:
      tags: [Requests]
      operationId: getRequest
      summary: Get an item request
      description: Returns one request and its current state. Clients must ignore unknown response fields.
      x-required-roles: [requester, jastiper, admin]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
              example:
                requestId: req_51Fa93cD
                requesterId: acc_req_7Kq91LmP
                itemDescription: Hard-cover research notebook
                quantity: 2
                targetStoreOrArea: Gramedia Central Park
                budget:
                  amount: 150000
                  currency: IDR
                deliveryAddress: Jl. Palmerah Barat No. 12, Jakarta
                deadline: '2026-09-05T18:00:00+07:00'
                status: assigned
                selectedOfferId: off_9Zx28LmQ
                assignedJastiperId: acc_jas_2Rt71BnP
                createdAt: '2026-09-03T08:00:00+07:00'
                updatedAt: '2026-09-03T08:12:00+07:00'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /requests/{requestId}/offers:
    get:
      tags: [Offers]
      operationId: listRequestOffers
      summary: List offers for a request
      description: Returns a paginated collection of offers belonging to the request. The status filter only narrows offers.
      x-required-roles: [requester, jastiper, admin]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OfferStatusQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated offer collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPage'
              example:
                items: []
                page:
                  limit: 10
                  nextCursor: null
                  hasMore: false
        '400':
          $ref: '#/components/responses/InvalidRequest400'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
      tags: [Offers]
      operationId: createOffer
      summary: Submit an offer
      description: |
        Creates an offer for an open request. Only a verified jastiper may submit an offer.
        Stock is an observation at stockCheckedAt, not a managed store inventory resource.
      x-required-roles: [jastiper]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOffer'
            example:
              itemPrice:
                amount: 120000
                currency: IDR
              serviceFee:
                amount: 15000
                currency: IDR
              deliveryFee:
                amount: 10000
                currency: IDR
              estimatedArrivalAt: '2026-09-04T18:00:00+07:00'
              stockCheckedAt: '2026-09-03T08:10:00+07:00'
              expiresAt: '2026-09-03T12:00:00+07:00'
              note: Item is available at the specified store.
      responses:
        '201':
          description: Offer created.
          headers:
            Location:
              description: URI of the created offer.
              schema:
                type: string
                example: /v1/offers/off_9Zx28LmQ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              example:
                offerId: off_9Zx28LmQ
                requestId: req_51Fa93cD
                jastiperId: acc_jas_2Rt71BnP
                status: active
                itemPrice:
                  amount: 120000
                  currency: IDR
                serviceFee:
                  amount: 15000
                  currency: IDR
                deliveryFee:
                  amount: 10000
                  currency: IDR
                totalAmount:
                  amount: 145000
                  currency: IDR
                estimatedArrivalAt: '2026-09-04T18:00:00+07:00'
                stockCheckedAt: '2026-09-03T08:10:00+07:00'
                expiresAt: '2026-09-03T12:00:00+07:00'
                note: Item is available at the specified store.
                createdAt: '2026-09-03T08:10:00+07:00'
        '400':
          $ref: '#/components/responses/PostBadRequest400'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '409':
          $ref: '#/components/responses/InvalidStateOrIdempotency409'
        '422':
          $ref: '#/components/responses/ValidationFailed422'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /offers/{offerId}:
    get:
      tags: [Offers]
      operationId: getOffer
      summary: Get an offer
      description: Returns one offer representation.
      x-required-roles: [requester, jastiper, admin]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Offer representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              example:
                offerId: off_9Zx28LmQ
                requestId: req_51Fa93cD
                jastiperId: acc_jas_2Rt71BnP
                status: active
                itemPrice:
                  amount: 120000
                  currency: IDR
                serviceFee:
                  amount: 15000
                  currency: IDR
                deliveryFee:
                  amount: 10000
                  currency: IDR
                totalAmount:
                  amount: 145000
                  currency: IDR
                estimatedArrivalAt: '2026-09-04T18:00:00+07:00'
                stockCheckedAt: '2026-09-03T08:10:00+07:00'
                expiresAt: '2026-09-03T12:00:00+07:00'
                note: Item is available at the specified store.
                createdAt: '2026-09-03T08:10:00+07:00'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /requests/{requestId}/assignments:
    post:
      tags: [Assignments]
      operationId: createAssignment
      summary: Select an offer
      description: |
        Selects exactly one active offer and creates the single active assignment for the request.
        The service checks and changes state atomically. The request must be open, the offer must belong to it and remain active, and no assignment may already exist.
      x-required-roles: [requester]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectOfferRequest'
            example:
              offerId: off_9Zx28LmQ
      responses:
        '201':
          description: Assignment created and the request moved from open to assigned.
          headers:
            Location:
              description: URI of the created assignment.
              schema:
                type: string
                example: /v1/assignments/asg_3Bn71RtP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
              example:
                assignmentId: asg_3Bn71RtP
                requestId: req_51Fa93cD
                offerId: off_9Zx28LmQ
                assignedJastiperId: acc_jas_2Rt71BnP
                status: active
                assignedAt: '2026-09-03T08:12:00+07:00'
                purchaseRecordedAt: null
                completedAt: null
                updatedAt: '2026-09-03T08:12:00+07:00'
        '400':
          $ref: '#/components/responses/PostBadRequest400'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '409':
          $ref: '#/components/responses/AssignmentConflict409'
        '422':
          $ref: '#/components/responses/ValidationFailed422'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /assignments/{assignmentId}:
    get:
      tags: [Assignments]
      operationId: getAssignment
      summary: Get an assignment
      description: Returns the selected request, offer, and assigned jastiper references with the current assignment state.
      x-required-roles: [requester, jastiper, admin]
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: Assignment representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
              example:
                assignmentId: asg_3Bn71RtP
                requestId: req_51Fa93cD
                offerId: off_9Zx28LmQ
                assignedJastiperId: acc_jas_2Rt71BnP
                status: purchased
                assignedAt: '2026-09-03T08:12:00+07:00'
                purchaseRecordedAt: '2026-09-03T08:30:00+07:00'
                completedAt: null
                updatedAt: '2026-09-03T08:30:00+07:00'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /assignments/{assignmentId}/payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Create a simulated payment
      description: Creates one simulated payment. The service calculates the amount from the selected offer. A declined simulation returns 422 as a domain result.
      x-required-roles: [requester]
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
            example:
              method: simulated_card
      responses:
        '201':
          description: Simulated payment created.
          headers:
            Location:
              description: URI of the created payment.
              schema:
                type: string
                example: /v1/payments/pay_4Lm82QwX
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                paymentId: pay_4Lm82QwX
                assignmentId: asg_3Bn71RtP
                amount:
                  amount: 145000
                  currency: IDR
                method: simulated_card
                status: succeeded
                failureReasonCode: null
                createdAt: '2026-09-03T08:35:00+07:00'
                updatedAt: '2026-09-03T08:35:01+07:00'
                refundedAt: null
        '400':
          $ref: '#/components/responses/PostBadRequest400'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '409':
          $ref: '#/components/responses/InvalidStateOrIdempotency409'
        '422':
          $ref: '#/components/responses/PaymentValidationOrDeclined422'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /payments/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Get a simulated payment
      description: Returns a simulated payment representation and does not claim settlement with a real provider.
      x-required-roles: [requester, jastiper, admin]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                paymentId: pay_4Lm82QwX
                assignmentId: asg_3Bn71RtP
                amount:
                  amount: 145000
                  currency: IDR
                method: simulated_card
                status: succeeded
                failureReasonCode: null
                createdAt: '2026-09-03T08:35:00+07:00'
                updatedAt: '2026-09-03T08:35:01+07:00'
                refundedAt: null
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /assignments/{assignmentId}/deliveries:
    post:
      tags: [Deliveries]
      operationId: createDelivery
      summary: Create a delivery
      description: |
        Creates one delivery after the simulated payment succeeds. The request records when the jastiper purchased the item.
        This contract stores no purchase receipt or stock evidence. If the item is unavailable after assignment, the service returns item-unavailable and handles the simulated refund according to Payment state.
      x-required-roles: [jastiper]
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDelivery'
            example:
              purchaseRecordedAt: '2026-09-03T08:30:00+07:00'
      responses:
        '201':
          description: Delivery created.
          headers:
            Location:
              description: URI of the created delivery.
              schema:
                type: string
                example: /v1/deliveries/dlv_8Qp21HsM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
              example:
                deliveryId: dlv_8Qp21HsM
                assignmentId: asg_3Bn71RtP
                status: pending
                deliveryAddress: Jl. Palmerah Barat No. 12, Jakarta
                lastLocation: null
                createdAt: '2026-09-03T08:36:00+07:00'
                startedAt: null
                deliveredAt: null
                confirmedAt: null
        '400':
          $ref: '#/components/responses/PostBadRequest400'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '409':
          $ref: '#/components/responses/DeliveryConflict409'
        '422':
          $ref: '#/components/responses/ValidationFailed422'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /deliveries/{deliveryId}:
    get:
      tags: [Deliveries]
      operationId: getDelivery
      summary: Get a delivery
      description: Returns the assignment reference, delivery state, address, and latest accepted location.
      x-required-roles: [requester, jastiper, admin]
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        '200':
          description: Delivery representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
              example:
                deliveryId: dlv_8Qp21HsM
                assignmentId: asg_3Bn71RtP
                status: in_transit
                deliveryAddress: Jl. Palmerah Barat No. 12, Jakarta
                lastLocation:
                  latitude: -6.1889
                  longitude: 106.7972
                  recordedAt: '2026-09-03T08:45:00+07:00'
                createdAt: '2026-09-03T08:36:00+07:00'
                startedAt: '2026-09-03T08:40:00+07:00'
                deliveredAt: null
                confirmedAt: null
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /deliveries/{deliveryId}/locations:
    get:
      tags: [Deliveries]
      operationId: listLocationUpdates
      summary: List delivery locations
      description: Returns paginated location history for one delivery. Location history is limited to the delivery phase.
      x-required-roles: [requester, jastiper, admin]
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated location history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationUpdatePage'
              example:
                items: []
                page:
                  limit: 20
                  nextCursor: null
                  hasMore: false
        '400':
          $ref: '#/components/responses/InvalidRequest400'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
    post:
      tags: [Deliveries]
      operationId: createLocationUpdate
      summary: Submit a delivery location
      description: |
        Appends one location update during delivery. A tracking device may submit only coordinates and recordedAt through the delivery context.
        The device cannot choose or change a transaction status. The service may move a pending delivery to in_transit after accepting its first valid location.
      x-required-roles: [jastiper, tracking-device]
      security:
        - bearerAuth: []
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationUpdate'
            example:
              latitude: -6.1889
              longitude: 106.7972
              recordedAt: '2026-09-03T08:45:00+07:00'
      responses:
        '201':
          description: Location update accepted.
          headers:
            Location:
              description: URI of the created location update.
              schema:
                type: string
                example: /v1/deliveries/dlv_8Qp21HsM/locations/loc_2Rt71BnP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationUpdate'
              example:
                locationId: loc_2Rt71BnP
                deliveryId: dlv_8Qp21HsM
                latitude: -6.1889
                longitude: 106.7972
                recordedAt: '2026-09-03T08:45:00+07:00'
                receivedAt: '2026-09-03T08:45:02+07:00'
        '400':
          $ref: '#/components/responses/PostBadRequest400'
        '401':
          $ref: '#/components/responses/AuthenticationRequired401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/ResourceNotFound404'
        '409':
          $ref: '#/components/responses/InvalidStateOrIdempotency409'
        '422':
          $ref: '#/components/responses/ValidationFailed422'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'

  /deliveries/{deliveryId}/receipt-confirmations:
    post:
      tags: [Deliveries]
      operationId: createReceiptConfirmation
      summary: Confirm delivery receipt
      description: Creates the single receipt confirmation. A second intent with a new key returns receipt-already-confirmed.
      x-required-roles: [requester]
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
