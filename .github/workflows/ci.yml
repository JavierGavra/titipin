name: P4 contract and authorization

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-and-authz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: titipin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d titipin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI service only. This is not an application credential.
      TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@127.0.0.1:5432/titipin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint:contract
      - run: node tests/check-security.cjs
      - run: npm run test:contract
      - run: npm run test:authz
      - run: npm run test:authz:mutations
